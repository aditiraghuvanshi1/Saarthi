<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Saarthi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="speak">
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header id="top"></header>
  <section class="hero">
    <div class="in"><div class="copy">
      <h1 data-i18n="nav_speak"></h1>
      <p data-i18n="speak_p"></p>
    </div></div>
  </section>
  <main id="main">
    <div class="split">
      <section class="panel">
        <h2 data-i18n="tts"></h2>
        <label for="txt" data-i18n="typepaste"></label>
        <textarea id="txt" rows="9" maxlength="5000"></textarea>
        <p id="wc" class="note">0</p>
        <label for="rate"><span data-i18n="speed"></span> <span id="rateOut"></span></label>
        <input id="rate" type="range" min="0.5" max="1.5" step="0.1">
        <div class="row">
          <button class="btn" data-say="#txt" data-i18n="listen"></button>
          <button class="btn ghost halt" data-i18n="stop"></button>
          <button class="btn ghost" data-copy="#txt" data-i18n="copy"></button>
        </div>
      </section>
      <section class="panel alt">
        <h2 data-i18n="stt"></h2>
        <div class="row">
          <button class="btn gold" id="mic" aria-pressed="false" data-i18n="mic"></button>
          <button class="btn ghost" id="clr" data-i18n="clear"></button>
        </div>
        <label for="out" data-i18n="yourwords"></label>
        <textarea id="out" rows="9"></textarea>
        <div class="row">
          <button class="btn ghost" data-say="#out" data-i18n="listen"></button>
          <button class="btn ghost" data-copy="#out" data-i18n="copy"></button>
          <button class="btn ghost" data-dl="#out" data-i18n="savetxt"></button>
        </div>
        <p id="sst" class="note" role="status"></p>
      </section>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
